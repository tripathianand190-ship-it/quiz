services:
  - type: web
    name: quiz-board
    runtime: node
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: quiz-data
      mountPath: /var/data
      sizeGB: 1
